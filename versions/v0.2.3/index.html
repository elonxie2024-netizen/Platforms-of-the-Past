<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11182d">
  <title>Platforms of the Past</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">A time-bending platform adventure</p>
        <h1>Platforms of the Past</h1>
      </div>
      <div class="header-actions">
        <button id="restartButton" class="restart" type="button" aria-label="Restart the current level" disabled>Restart <kbd>R</kbd></button>
        <button id="quitButton" class="quit-button" type="button" disabled>Quit</button>
      </div>
    </header>

    <section class="game-frame" aria-label="Platforms of the Past game">
      <div class="hud" aria-live="polite">
        <span id="levelLabel">Level 1 / 10</span>
        <span id="timerLabel">Time 0:00.0</span>
        <span id="starLabel">Stars 0 / 0</span>
      </div>
      <button id="fullscreenButton" class="fullscreen-toggle" type="button" aria-label="Enter full screen" title="Enter full screen" aria-pressed="false">
        <svg class="fullscreen-icon fullscreen-icon-expand" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5" />
        </svg>
        <svg class="fullscreen-icon fullscreen-icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        </svg>
      </button>
      <div id="mainMenu" class="main-menu">
        <div class="menu-panel">
          <p class="menu-version">v0.2.3</p>
          <h2>Platforms of the Past</h2>
          <div class="menu-stage" role="img" aria-label="A green slime endlessly jumping between two grassy platforms">
            <div class="menu-platform menu-platform-left" aria-hidden="true"></div>
            <div class="menu-platform menu-platform-right" aria-hidden="true"></div>
            <div class="menu-slime" aria-hidden="true"></div>
          </div>
          <div class="menu-actions">
            <button id="playButton" type="button">Play</button>
            <button id="settingsButton" type="button" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
          </div>
          <div id="settingsPanel" class="settings-panel" hidden>
            <label for="volumeInput">Volume <output id="volumeValue" for="volumeInput">100%</output></label>
            <input id="volumeInput" type="range" min="0" max="100" value="100" step="1">
          </div>
        </div>
      </div>
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Platform game. Move with A and D or the arrow keys. Jump with W, Up Arrow, or Space."></canvas>
      <div id="message" class="message" hidden>
        <p class="eyebrow">Adventure complete</p>
        <h2>You reached the summit!</h2>
        <p id="scoreSummary"></p>
        <div class="message-actions">
          <button id="playAgainButton" type="button">Play again</button>
          <button id="victoryQuitButton" type="button">Quit</button>
        </div>
      </div>
    </section>

    <div class="touch-controls" aria-label="Touch controls">
      <button type="button" data-control="left" aria-label="Move left">&#9664;</button>
      <button type="button" data-control="right" aria-label="Move right">&#9654;</button>
      <button type="button" data-control="jump" class="jump" aria-label="Jump">Jump</button>
    </div>

    <p class="instructions"><strong>Move</strong> A / D or arrows <span aria-hidden="true">&bull;</span> <strong>Jump</strong> W / Up / Space <span aria-hidden="true">&bull;</span> <strong>Restart</strong> R</p>
  </main>
  <script src="game.js?v=0.2.3"></script>
</body>
</html>
