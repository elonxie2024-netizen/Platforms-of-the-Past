<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11182d">
  <title>Platforms of the Past</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">A time-bending platform adventure</p>
        <h1>Platforms of the Past</h1>
      </div>
      <button id="restartButton" class="restart" type="button" aria-label="Restart the current level">Restart <kbd>R</kbd></button>
    </header>

    <section class="game-frame" aria-label="Platforms of the Past game">
      <div class="hud" aria-live="polite">
        <span id="levelLabel">Level 1 / 3</span>
        <span id="starLabel">Stars 0 / 0</span>
      </div>
      <button id="fullscreenButton" class="fullscreen-toggle" type="button" aria-label="Enter full screen" title="Enter full screen" aria-pressed="false">
        <svg class="fullscreen-icon fullscreen-icon-expand" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5" />
        </svg>
        <svg class="fullscreen-icon fullscreen-icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        </svg>
      </button>
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="Platform game. Move with A and D or the arrow keys. Jump with W, Up Arrow, or Space."></canvas>
      <div id="message" class="message" hidden>
        <p class="eyebrow">Adventure complete</p>
        <h2>You reached the summit!</h2>
        <p id="scoreSummary"></p>
        <button id="playAgainButton" type="button">Play again</button>
      </div>
    </section>

    <div class="touch-controls" aria-label="Touch controls">
      <button type="button" data-control="left" aria-label="Move left">&#9664;</button>
      <button type="button" data-control="right" aria-label="Move right">&#9654;</button>
      <button type="button" data-control="jump" class="jump" aria-label="Jump">Jump</button>
    </div>

    <p class="instructions"><strong>Move</strong> A / D or arrows <span aria-hidden="true">&bull;</span> <strong>Jump</strong> W / Up / Space <span aria-hidden="true">&bull;</span> <strong>Restart</strong> R</p>
  </main>
  <script src="game.js?v=0.0.12"></script>
</body>
</html>
